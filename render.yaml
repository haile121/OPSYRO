services:
  - type: keyvalue
    name: opsyro-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

  - type: web
    name: opsyro-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: opsyro-api.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: opsyro-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: opsyro-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: TWITCH_EXTENSION_SECRET
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: TWITCH_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: TWITCH_REDIRECT_URI
        sync: false
      - key: TWITCH_OAUTH_RETURN_URL
        sync: false

databases:
  - name: opsyro-postgres
    databaseName: opsyro
    user: opsyro
    ipAllowList: []
